        function getWeeklyPeriodeText() {
            const today = new Date();
            const dayOfWeek = today.getDay();
            const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;

            const monday = new Date(today);
            monday.setDate(today.getDate() + diffToMonday);

            const sunday = new Date(monday);
            sunday.setDate(monday.getDate() + 6);

            const monthNames = [
                "Januari", "Februari", "Maret", "April", "Mei", "Juni",
                "Juli", "Agustus", "September", "Oktober", "November", "Desember"
            ];

            return `Periode ${monday.getDate()} ${monthNames[monday.getMonth()]} - ${sunday.getDate()} ${monthNames[sunday.getMonth()]} ${sunday.getFullYear()}`;
        }

        function updatePeriodeHeader() {
            const text = getWeeklyPeriodeText();
            const el = document.getElementById('periodeHeader');
            if (el) el.textContent = text;
            return text;
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            manpowerData.forEach((item, idx) => {
                const tr = document.createElement('tr');
                tr.dataset.index = idx;

                let html = `<td>${item.no}</td><td class="name-col">${item.name}</td>`;

                if (item.bagian !== null) {
                    html += `<td rowspan="${item.rowspan}">${item.bagian}</td>`;
                    html += `<td rowspan="${item.rowspan}">${item.jumlah}</td>`;
                }

                for (let d = 0; d < 7; d++) {
                    html += `
                        <td>
                            <select class="status-select masuk" onchange="calculateTotals(); updateSelectStyle(this);">
                                <option value="MASUK" selected>MASUK</option>
                                <option value="OFF">OFF</option>
                            </select>
                        </td>`;
                }

                html += `<td class="total-masuk-cell">7</td><td class="total-off-cell">0</td>`;
                tr.innerHTML = html;
                tbody.appendChild(tr);
            });

            calculateTotals();
        }

        function updateSelectStyle(selectEl) {
            if (selectEl.value === 'OFF') {
                selectEl.classList.remove('masuk');
                selectEl.classList.add('off');
            } else {
                selectEl.classList.remove('off');
                selectEl.classList.add('masuk');
            }
        }

        function calculateTotals() {
            const rows = document.querySelectorAll('#tableBody tr');
            const dailyMasuk = [0, 0, 0, 0, 0, 0, 0];
            const dailyOff = [0, 0, 0, 0, 0, 0, 0];

            rows.forEach(tr => {
                const selects = tr.querySelectorAll('select.status-select');
                let userMasuk = 0;
                let userOff = 0;

                selects.forEach((sel, dayIndex) => {
                    if (sel.value === 'OFF') {
                        userOff++;
                        dailyOff[dayIndex]++;
                    } else {
                        userMasuk++;
                        dailyMasuk[dayIndex]++;
                    }
                });

                tr.querySelector('.total-masuk-cell').textContent = userMasuk;
                tr.querySelector('.total-off-cell').textContent = userOff;
            });

            for (let i = 0; i < 7; i++) {
                document.getElementById(`tot-masuk-${i}`).textContent = dailyMasuk[i];
                document.getElementById(`tot-off-${i}`).textContent = dailyOff[i];
            }
        }

        function loadFromGoogleSheets() {
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("PASTE_URL")) {
                renderTable();
                return;
            }

            renderTable();

            // Tambahkan timestamp (?t=...) agar browser tidak menaruh data lama di cache
            fetch(GOOGLE_SCRIPT_URL + "?t=" + new Date().getTime())
                .then(res => res.json())
                .then(data => {
                    if (data && data.rows && data.rows.length > 0) {
                        if (data.periode) {
                            const el = document.getElementById('periodeHeader');
                            if (el) el.textContent = data.periode;
                        }

                        const rows = document.querySelectorAll('#tableBody tr');
                        data.rows.forEach((r, idx) => {
                            if (rows[idx] && r.days) {
                                const selects = rows[idx].querySelectorAll('select.status-select');
                                const dayKeys = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
                                dayKeys.forEach((day, dIdx) => {
                                    if (selects[dIdx] && r.days[day]) {
                                        selects[dIdx].value = r.days[day];
                                        updateSelectStyle(selects[dIdx]);
                                    }
                                });
                            }
                        });

                        calculateTotals();
                    }
                })
                .catch(err => console.log("Gagal memuat dari Sheets:", err));
        }

        function saveToGoogleSheets() {
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.includes("https://script.google.com/macros/s/AKfycbxs68ZrWESZD-fgf43B9SUYY0UvGJA0wjex7USis5Ig7aKZL66mzRR_ZIQiDADJQjEy/exec")) {
                alert("Harap masukkan URL Web App Google Apps Script Anda!");
                return;
            }

            const btn = document.querySelector('.btn-save');
            btn.disabled = true;
            btn.textContent = "⏳ Menyimpan...";

            const rows = document.querySelectorAll('#tableBody tr');
            const rowData = [];

            rows.forEach((tr, idx) => {
                const selects = tr.querySelectorAll('select.status-select');
                const days = {
                    Senin: selects[0].value,
                    Selasa: selects[1].value,
                    Rabu: selects[2].value,
                    Kamis: selects[3].value,
                    Jumat: selects[4].value,
                    Sabtu: selects[5].value,
                    Minggu: selects[6].value
                };

                rowData.push({
                    no: manpowerData[idx].no,
                    name: manpowerData[idx].name,
                    bagian: manpowerData[idx].bagian || "",
                    jumlah: manpowerData[idx].jumlah || "",
                    days: days,
                    totalMasuk: tr.querySelector('.total-masuk-cell').textContent,
                    totalOff: tr.querySelector('.total-off-cell').textContent
                });
            });

            const daysHeader = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu', 'Minggu'];
            const totals = { masuk: {}, off: {} };
            daysHeader.forEach((day, i) => {
                totals.masuk[day] = document.getElementById(`tot-masuk-${i}`).textContent;
                totals.off[day] = document.getElementById(`tot-off-${i}`).textContent;
            });

            const payload = {
                title: "ABSENSI MANPOWER PACKING LINE-4",
                periode: document.getElementById('periodeHeader').textContent,
                rows: rowData,
                totals: totals
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            }).then(() => {
                alert("Data absensi berhasil disimpan ke Google Sheets!");
                btn.disabled = false;
                btn.textContent = "💾 Simpan Data";
            }).catch(err => {
                alert("Gagal menyimpan data: " + err);
                btn.disabled = false;
                btn.textContent = "💾 Simpan Data";
            });
        }

        window.onload = function() {
            updatePeriodeHeader();
            loadFromGoogleSheets();
        };
